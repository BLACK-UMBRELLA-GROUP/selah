name: selah
description: "Selah — private Christian marriage application first draft."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  http: 1.6.0
  image_picker: ^1.1.2
  crop_your_image: 2.0.0
  image: 4.9.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: 11.1.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  share_plus: 13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/auth/google_g_logo.png
    - assets/icon/icon.png
    - assets/dev/one_journey_photos/
    - assets/fonts/figtree-OFL.txt
    - assets/fonts/cormorantgaramond-OFL.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree[wght].ttf
          weight: 400
        - asset: assets/fonts/Figtree[wght].ttf
          weight: 500
        - asset: assets/fonts/Figtree[wght].ttf
          weight: 600
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond[wght].ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Italic[wght].ttf
          weight: 600
          style: italic
